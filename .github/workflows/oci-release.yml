name: Publish Tyk OCI plugin artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, publish, and sign OCI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/nextmoca/tyk-ai-studio-runtime-defense-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify that the release tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve immutable release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          manifest_version=$(jq -er '.version' manifest.json)
          test "$manifest_version" = "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish per-platform plugin artifacts
        id: publish
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p bin
          for arch in amd64 arm64; do
            binary="bin/nextmoca-tyk-plugin-linux_$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "$binary" ./cmd/nextmoca-tyk-plugin
            chmod +x "$binary"
            oras push "$IMAGE:$version-linux_$arch" \
              --artifact-type application/vnd.tyk.plugin.binary.v1 \
              --artifact-platform linux/$arch \
              "$binary:application/vnd.tyk.plugin.layer.v1"
          done
          oras manifest index create "$IMAGE:$version" \
            "$version-linux_amd64" "$version-linux_arm64"
          digest="$(oras manifest fetch --descriptor "$IMAGE:$version" | jq -r .digest)"
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign and verify the immutable index digest
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_KEY"
          test -n "$COSIGN_PASSWORD"
          cosign sign --yes --key env://COSIGN_KEY \
            "$IMAGE@${{ steps.publish.outputs.digest }}"
          cosign verify --key cosign.pub "$IMAGE@${{ steps.publish.outputs.digest }}"

      - name: Write release metadata
        run: |
          {
            printf 'image=%s\n' "${IMAGE}"
            printf 'tag=%s\n' "${{ steps.version.outputs.version }}"
            printf 'digest=%s\n' "${{ steps.publish.outputs.digest }}"
            printf 'oci_reference=oci://%s@%s\n' "${IMAGE}" "${{ steps.publish.outputs.digest }}"
          } | tee release-oci.txt
          cat release-oci.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tyk-oci-release-metadata
          path: release-oci.txt
          if-no-files-found: error
