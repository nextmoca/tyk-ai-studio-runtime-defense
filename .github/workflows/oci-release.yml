name: Publish Tyk OCI plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, attest, and sign OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/nextmoca/tyk-ai-studio-runtime-defense-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify that the release tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve immutable release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          manifest_version=$(jq -er '.version' manifest.json)
          test "$manifest_version" = "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the thin plugin image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Verify the published multi-architecture index
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" | tee image-inspect.txt
          grep -F 'linux/amd64' image-inspect.txt
          grep -F 'linux/arm64' image-inspect.txt

      - uses: sigstore/cosign-installer@v3

      - name: Keylessly sign the immutable digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Write release metadata
        run: |
          {
            printf 'image=%s\n' "${IMAGE}"
            printf 'tag=%s\n' "${{ steps.version.outputs.version }}"
            printf 'digest=%s\n' "${{ steps.build.outputs.digest }}"
            printf 'oci_reference=oci://%s@%s\n' "${IMAGE}" "${{ steps.build.outputs.digest }}"
          } | tee release-oci.txt
          cat release-oci.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tyk-oci-release-metadata
          path: release-oci.txt
          if-no-files-found: error
